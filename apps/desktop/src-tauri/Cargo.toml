[package]
name = "echo-canvas-desktop"
description = "Echo Canvas Desktop application shell: Tauri commands, events, menus, dialogs and capabilities."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "echo-canvas-desktop"

[lib]
name = "ec_desktop"
path = "src/lib.rs"

[[bin]]
name = "echo-canvas-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
serde.workspace = true
specta.workspace = true
tauri.workspace = true
tauri-specta.workspace = true

[dev-dependencies]
serde_json.workspace = true
specta-typescript.workspace = true
tauri-specta = { workspace = true, features = ["typescript"] }
tempfile.workspace = true

[lints]
workspace = true
